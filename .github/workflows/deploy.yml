name: Deploy to VPS

# Auto-deploy przy każdym push do main: SSH na VPS i twardy reset do origin/main.
# Strona jest statyczna (HTML/CSS/JS) — bez build/instalacji, więc deploy to czysty git pull.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-letsartbarbershop
  cancel-in-progress: false

jobs:
  deploy:
    name: git pull on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SSH and pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            git fetch --prune origin
            git reset --hard origin/main
            echo "Deployed commit: $(git rev-parse --short HEAD)"
